[package]
name = "flight_tape"
version = "0.1.5"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/flight_tape"
homepage = "https://github.com/savageAZfck/flight_tape"
license = "MIT"
description = "Flight recorder for autonomous systems: bounded hash-chained decision tape, freeze-on-incident into signed bundles, offline verify and replay"
keywords = ["audit", "incident", "forensics", "hash-chain", "agent"]
categories = ["cryptography", "filesystem", "data-structures"]
readme = "README.md"
exclude = [
    "/fuzz",
    "/.github",
]

[features]
default = ["snapshot"]
# Capture respawn state snapshots into freeze bundles. Disable for
# frames-only bundles with no respawned dependency.
snapshot = ["dep:respawned", "dep:walkdir"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1"
ed25519-dalek = "2.1"
rand = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
respawned = { version = "0.3", optional = true }
walkdir = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[[bin]]
name = "flight-tape"
path = "src/main.rs"
