[package]
name = "flight_tape-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flight_tape = { path = "..", default-features = false }

[[bin]]
name = "frame_parse"
path = "fuzz_targets/frame_parse.rs"
test = false
doc = false

[[bin]]
name = "ring_line"
path = "fuzz_targets/ring_line.rs"
test = false
doc = false
